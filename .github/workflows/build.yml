name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - run: chmod +x ./gradlew

      - name: Build and unit tests
        run: ./gradlew build --stacktrace

      - name: In-game test (singleplayer, screenshots)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find . -path ./screenshots -prune -o -type f -path '*screenshots*' -name '*.png' -exec cp {} screenshots/ \; || true

      - uses: actions/upload-artifact@v7
        with:
          name: angelic-halo-jar
          path: build/libs/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: in-game-screenshots
          path: screenshots/

  skyblock-compat:
    # Same in-game test, but with a typical Hypixel Skyblock mod set (Sodium, Iris, Skyblocker, Firmament, ...)
    # downloaded from Modrinth, to catch conflicts. Singleplayer only, never connects to a server.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - name: Download Skyblock mod set from Modrinth
        run: python3 scripts/compat_mods.py "$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" compat-mods
      - name: In-game test with the mod set
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
          # dependency downloads can hit Maven Central rate limits when many jobs run at once: retry them first
          for i in 1 2 3; do ./gradlew gametestClasses -PcompatMods=compat-mods && break; sleep $((i * 30)); done
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -PcompatMods=compat-mods --stacktrace
      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          cp compat-mods/MODS.txt results/ || true
          find . -path ./results -prune -o -type f -path '*screenshots*' -name '*.png' -exec cp {} results/ \; || true
          find . -path ./results -prune -o -type f -name 'latest.log' -path '*logs*' -exec cp {} results/latest.log \; || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: skyblock-compat-results
          path: results/

  shaders:
    # Same scenes with and without each popular shaderpack (Iris + Sodium), to make sure colours survive shaders.
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pack: [complementary-reimagined, complementary-unbound, bsl-shaders, photon-shader, solas-shader, bliss-shader, makeup-ultra-fast-shaders, sildurs-vibrant-shaders, rethinking-voxels]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - name: Sodium + Iris and the shaderpack
        run: |
          MC="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          python3 scripts/compat_mods.py "$MC" compat-mods sodium iris
          echo "HALO_SHADERPACK=$(python3 scripts/shaderpacks.py ${{ matrix.pack }} shaderpack | tail -1)" >> "$GITHUB_ENV"
      - name: In-game test with the shaderpack (singleplayer)
        id: test
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
          # dependency downloads can hit Maven Central rate limits when many jobs run at once: retry them first
          for i in 1 2 3; do ./gradlew gametestClasses -PcompatMods=compat-mods && break; sleep $((i * 30)); done
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -PcompatMods=compat-mods --stacktrace
      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          cp shaderpack/PACK.txt results/ || true
          find . -path ./results -prune -o -type f -path '*screenshots*' -name '*.png' -exec cp {} results/ \; || true
          find . -path ./results -prune -o -type f -name 'latest.log' -path '*logs*' -exec cp {} results/latest.log \; || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shader-${{ matrix.pack }}
          path: results/

  essential:
    # Launcher-style run with Essential (it refuses to start in a development environment).
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: python3 scripts/compat_mods.py "$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" compat-mods essential
      - name: In-game test with Essential (singleplayer)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
          for i in 1 2 3; do ./gradlew jar gametestJar -PcompatMods=compat-mods && break; sleep $((i * 30)); done
          mkdir -p run/prod && printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\n' > run/prod/options.txt
          ./gradlew prodClientGameTest -PcompatMods=compat-mods --stacktrace
      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          find run/prod -type f -path '*screenshots*' -name '*.png' -exec cp {} results/ \; || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: essential-results
          path: results/
