# Scratch-repo only: runs the README showcase with the owner's skin and publishes screenshots to ci-output.
name: dev-preview
on:
  push:
    branches: [angelic-halo]
permissions:
  contents: write
jobs:
  showcase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - name: Owner's skin (test client only)
        run: python3 scripts/fetch_skin.py itsd7 src/gametest/resources | tee skin.txt
      - id: test
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
          for i in 1 2 3; do ./gradlew gametestClasses && break; sleep $((i * 30)); done
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace
      - if: always()
        run: |
          mkdir -p out/screenshots
          cp skin.txt out/ || true
          find . -path ./out -prune -o -type f -path '*screenshots*' -name '*.png' -exec cp {} out/screenshots/ \; || true
          echo "showcase=${{ steps.test.outcome }} sha=${{ github.sha }}" > out/STATUS.txt
          cd out && git init -q -b ci-output && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "showcase ${{ github.sha }}" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-output
