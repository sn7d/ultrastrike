# Scratch-repo only: publishes compat test results to the ci-output branch so they can be reviewed.
name: dev-preview
on:
  push:
    branches: [angelic-halo]
permissions:
  contents: write
jobs:
  compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: python3 scripts/compat_mods.py "$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" compat-mods
      - id: test
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -PcompatMods=compat-mods --stacktrace 2>&1 | tee gametest.log; exit ${PIPESTATUS[0]}
      - if: always()
        run: |
          mkdir -p out/screenshots
          cp compat-mods/MODS.txt gametest.log out/ || true
          find . -path ./out -prune -o -type f -path '*screenshots*' -name '*.png' -exec cp {} out/screenshots/ \; || true
          find . -path ./out -prune -o -type f -name 'latest.log' -path '*logs*' -exec cp {} out/latest.log \; || true
          echo "compat=${{ steps.test.outcome }} sha=${{ github.sha }}" > out/STATUS.txt
          cd out && git init -q -b ci-output && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "compat ${{ github.sha }}" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-output
