# Scratch-repo only: runs the shader matrix and publishes the screenshots to the ci-output branch for review.
name: dev-preview
on:
  push:
    branches: [angelic-halo]
permissions:
  contents: write
jobs:
  shaders:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pack: [complementary-reimagined, complementary-unbound, bsl-shaders, photon-shader, solas-shader, bliss-shader, makeup-ultra-fast-shaders, sildurs-vibrant-shaders, rethinking-voxels]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - name: Sodium + Iris and the shaderpack
        run: |
          MC="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          python3 scripts/compat_mods.py "$MC" compat-mods sodium iris
          echo "HALO_SHADERPACK=$(python3 scripts/shaderpacks.py ${{ matrix.pack }} shaderpack | tail -1)" >> "$GITHUB_ENV"
      - name: In-game test with the shaderpack (singleplayer)
        id: test
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
          # dependency downloads can hit Maven Central rate limits when many jobs run at once: retry them first
          for i in 1 2 3; do ./gradlew gametestClasses -PcompatMods=compat-mods && break; sleep $((i * 30)); done
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -PcompatMods=compat-mods --stacktrace
      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          cp shaderpack/PACK.txt results/ || true
          find . -path ./results -prune -o -type f -path '*screenshots*' -name '*.png' -exec cp {} results/ \; || true
          find . -path ./results -prune -o -type f -name 'latest.log' -path '*logs*' -exec cp {} results/latest.log \; || true
          echo "${{ steps.test.outcome }}" > results/OUTCOME.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shader-${{ matrix.pack }}
          path: results/

  publish:
    needs: shaders
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
      - run: |
          cd out
          for d in */; do echo "${d%/} $(cat $d/OUTCOME.txt 2>/dev/null) $(cat $d/PACK.txt 2>/dev/null)"; done > STATUS.txt
          echo "sha=${{ github.sha }}" >> STATUS.txt
          git init -q -b ci-output && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "shaders ${{ github.sha }}" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-output
