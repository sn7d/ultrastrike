plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Minecraft line to build: -Pmc=26.1 | 26.2 | 26.3 (see versions/README.md); defaults to mc_line.
def mcLine = (project.findProperty('mc') ?: project.mc_line).toString()
def lineProps = new Properties()
file("versions/${mcLine}.properties").withInputStream { lineProps.load(it) }
// a -P on the command line wins over the versions file (CI uses it to test each patch release)
def lineProp = { String key -> gradle.startParameter.projectProperties[key] ?: lineProps.getProperty(key) }
ext.mcLine = mcLine
ext.minecraftVersion = lineProp('minecraft_version')
ext.fabricApiVersion = lineProp('fabric_api_version')
ext.modmenuVersion = lineProp('modmenu_version')
ext.mcRange = lineProp('mc_range')
ext.gameVersions = lineProp('game_versions')

version = "${project.mod_version}+${mcLine}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu (optional integration, compile-only) is published here by TerraformersMC.
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/'
	}
}

sourceSets {
	main {
		java {
			lineProp('compat').split(',').each { srcDir "src/compat/${it.trim()}/java" }
		}
	}
}

fabricApi {
	// Real in-game client tests (Fabric client gametest API). These boot an actual
	// Minecraft client, create a test world, and take screenshots of the halo.
	configureTests {
		createSourceSet = true
		modId = 'aureole-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// CI compatibility run: -PcompatMods=<dir of jars> loads a typical Skyblock mod set next to the mod
	if (project.hasProperty('compatMods')) {
		runtimeOnly fileTree(dir: project.property('compatMods'), include: '*.jar')
	}

	compileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat "full"
	}
}

processResources {
	def props = [version: project.version, mc_range: mcRange, loader_min: project.loader_min]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Dev helper used by CI: prints the compile classpath so API signatures can be inspected with javap.
tasks.register('printCompileClasspath') {
	def files = sourceSets.main.compileClasspath + sourceSets.gametest.compileClasspath
	doLast {
		files.each { println "CP: ${it}" }
	}
}

// Launcher-like ("production") client run of the in-game tests, with real mod jars in a mods folder.
// Needed for mods such as Essential that refuse to start in a development environment.
configurations {
	prodMods {
		transitive = false
	}
	// resolves Fabric API's modules, to pick out the dev-only client gametest module (not in the fat jar)
	prodApiModules {
		transitive = true
	}
}

dependencies {
	prodMods "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	prodApiModules "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

def gametestJar = tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	archiveClassifier = 'gametest'
	destinationDirectory = layout.buildDirectory.dir('gametest-libs')
}

tasks.register('prodClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(tasks.named('jar'))
	mods.from(gametestJar)
	mods.from(configurations.prodMods)
	mods.from(configurations.prodApiModules.filter { it.name.startsWith('fabric-client-gametest-api-v1') })
	if (project.hasProperty('compatMods')) {
		mods.from(fileTree(dir: project.property('compatMods'), include: '*.jar'))
	}
	jvmArgs.add('-Dfabric.client.gametest')
	runDir = layout.projectDirectory.dir('run/prod')
	useXVFB = true
}
